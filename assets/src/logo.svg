      <ellipse cx="300" cy="245" rx="112" ry="98" fill="none"/>
      <ellipse cx="258" cy="254" rx="15" ry="20" fill="#0B3A66" stroke="none"/>
      <ellipse cx="342" cy="254" rx="15" ry="20" fill="#0B3A66" stroke="none"/>
      <circle cx="263" cy="246" r="6" fill="#FFFFFF" stroke="none"/><circle cx="347" cy="246" r="6" fill="#FFFFFF" stroke="none"/>
      <circle cx="225" cy="288" r="17" fill="#FB7185" opacity=".5" stroke="none"/><circle cx="375" cy="288" r="17" fill="#FB7185" opacity=".5" stroke="none"/>
      <path d="M262 286 Q300 334 338 286 Q300 300 262 286 Z" fill="#A3233F" stroke-width="7"/>

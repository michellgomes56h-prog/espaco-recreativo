    <g transform="translate(166 205) scale(.68) translate(-300 -232)" stroke-width="10">
      <path d="M300 84 V48" stroke-width="9"/>
      <circle cx="300" cy="42" r="12" fill="#FACC15"/>
      <circle cx="300" cy="232" r="152" fill="#FFFFFF"/>
      <rect x="130" y="198" width="34" height="72" rx="14" fill="#38BDF8"/>
      <rect x="436" y="198" width="34" height="72" rx="14" fill="#38BDF8"/>
      <ellipse cx="300" cy="245" rx="112" ry="98" fill="#FFDDBF" stroke="none"/>
      <g clip-path="url(#face)">
        <path d="M176 140 H424 V214 C400 206 384 192 372 172 C352 200 306 206 270 188 C254 206 222 214 180 226 Z" fill="#7A4A2A" stroke-width="7"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Logo PROVISÓRIO. Substitua /assets/logo.png pelo logo oficial do Espaço Recreativo. -->
  <defs>
    <radialGradient id="sky" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#BAE6FD"/><stop offset=".6" stop-color="#7DD3FC"/><stop offset="1" stop-color="#38BDF8"/>
    </radialGradient>
    <clipPath id="c"><circle cx="200" cy="200" r="196"/></clipPath>
    <clipPath id="face"><ellipse cx="300" cy="245" rx="112" ry="98"/></clipPath>
    <linearGradient id="glove" x1="0" y1="0" x2="0" y2="1">

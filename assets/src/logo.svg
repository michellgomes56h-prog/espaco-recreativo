    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="196" fill="url(#sky)"/>
  <g clip-path="url(#c)" stroke="#0B3A66" stroke-linejoin="round" stroke-linecap="round">
    <g fill="#FFFFFF" stroke="none" opacity=".95">
      <circle cx="70" cy="80" r="4"/><circle cx="340" cy="250" r="5"/><circle cx="110" cy="40" r="3"/><circle cx="360" cy="310" r="3"/>
    </g>
    <polygon transform="translate(60 150) scale(.6)" fill="#FACC15" stroke-width="6" points="0,-24 6.5,-8.9 22.8,-7.4 10.5,3.4 14.1,19.4 0,11 -14.1,19.4 -10.5,3.4 -22.8,-7.4 -6.5,-8.9"/>
    <path d="M-10 380 Q40 330 100 352 Q150 312 210 350 Q270 318 320 352 Q370 330 420 360 V420 H-10 Z" fill="#FFFFFF" stroke="none"/>
    <!-- corpo -->
    <rect x="92" y="300" width="150" height="160" rx="60" fill="#FFFFFF" stroke-width="8"/>
    <rect x="128" y="330" width="78" height="44" rx="12" fill="#E0F4FF" stroke-width="6"/>
    <circle cx="148" cy="352" r="7" fill="#38BDF8" stroke-width="4"/><circle cx="167" cy="352" r="7" fill="#FACC15" stroke-width="4"/><circle cx="186" cy="352" r="7" fill="#FB7185" stroke-width="4"/>
    <!-- mastro e bandeira -->
    <path d="M262 92 V340" stroke-width="8"/>
    <circle cx="262" cy="86" r="9" fill="#FACC15" stroke-width="6"/>
    <path d="M262 104 Q292 92 318 104 T374 104 V184 Q346 172 318 184 T262 184 Z" fill="#FFFFFF" stroke-width="6"/>
    <text x="318" y="138" font-family="Fredoka, Nunito, sans-serif" font-weight="700" font-size="20" fill="#0B3A66" stroke="none" text-anchor="middle">ESPAÇO</text>
    <text x="318" y="164" font-family="Fredoka, Nunito, sans-serif" font-weight="700" font-size="14.5" fill="#0369A1" stroke="none" text-anchor="middle">RECREATIVO</text>
    <!-- braço segurando o mastro -->
    <path d="M220 330 Q250 300 258 262" stroke-width="44" fill="none"/>
    <path d="M220 330 Q250 300 258 262" stroke="#FFFFFF" stroke-width="30" fill="none"/>
    <circle cx="262" cy="258" r="20" fill="url(#glove)" stroke-width="6"/>
